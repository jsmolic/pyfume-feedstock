schema_version: 1

context:
  name: pyfume
  version: "0.3.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 5305b93b015fbb4d650cac33ef6881d9e81b3a8c5bfadf149c41485236667df5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - scipy ==1.10.1
    - numpy ==1.24.4
    - simpful ==2.12.0
    - fst-pso ==1.8.1
    - pandas ==1.5.3

tests:
  - python:
      imports:
        - pyfume
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: A Python package for fuzzy model estimation
  license: GPL-3.0-only
  license_file: LICENSE
  homepage: https://github.com/CaroFuchs/pyFUME

extra:
  recipe-maintainers:
    - bgruening
